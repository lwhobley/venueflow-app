name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  backup:
    name: Backup production database to S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_POOLER_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_AWS_REGION }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unzip curl
          curl --fail --silent --show-error --location https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip --output /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

      - name: Create and upload encrypted database dump
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DATABASE_URL:?PRODUCTION_POOLER_DATABASE_URL is not configured}"
          : "${AWS_ACCESS_KEY_ID:?BACKUP_AWS_ACCESS_KEY_ID is not configured}"
          : "${AWS_SECRET_ACCESS_KEY:?BACKUP_AWS_SECRET_ACCESS_KEY is not configured}"
          : "${AWS_DEFAULT_REGION:?BACKUP_AWS_REGION is not configured}"
          : "${BACKUP_BUCKET:?BACKUP_S3_BUCKET is not configured}"

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="/tmp/venue-wrangler-${timestamp}.dump"
          archive="${dump}.gz"

          docker run --rm --network host --env DATABASE_URL="$DATABASE_URL" --volume /tmp:/backup \
            postgres:17-alpine pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl \
            --file="/backup/$(basename "$dump")"
          gzip --best "$dump"
          aws s3 cp "$archive" "s3://${BACKUP_BUCKET}/database-backups/$(basename "$archive")" \
            --sse AES256 --only-show-errors
          aws s3api head-object --bucket "$BACKUP_BUCKET" \
            --key "database-backups/$(basename "$archive")" >/dev/null
          rm -f "$archive"
