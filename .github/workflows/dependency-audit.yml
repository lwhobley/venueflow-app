name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/api/package.json'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/api/package.json'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-production:
    name: API production dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on high/critical API production vulnerabilities
        run: npm audit --omit=dev --workspace=@venue-wrangler/api --audit-level=high

  mobile-toolchain:
    name: Mobile and Metro advisory inventory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report high/critical root production graph advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Explain current Metro image-size exception
        if: failure()
        run: |
          echo "The current Expo 54 / Metro graph includes image-size <=2.0.2."
          echo "GitHub advisories GHSA-w3rx-r6r6-pgpr and GHSA-5p2g-fcmc-qvqq currently list no patched image-size release."
          echo "Metro/image-size is Node build tooling and is not shipped in the mobile runtime or Nest API."
          echo "Keep this job visible and re-evaluate when Expo/Metro or image-size publishes a patched dependency path."

  full-inventory:
    name: Full dependency inventory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report all high/critical vulnerabilities including dev tooling
        run: npm audit --audit-level=high
