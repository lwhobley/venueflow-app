name: Desktop Web CI

# The desktop-web branch deploys the web frontend (app/, components/, lib/,
# site/) to Cloudflare — but its deploy workflow only builds, it doesn't
# typecheck. This gate runs the frontend typecheck on every push/PR so a
# contract drift or type error can't ship to the web app unnoticed. It
# intentionally does NOT touch packages/api (that is deployed from main and is
# excluded from the root tsconfig).

on:
  push:
    branches: [desktop-web]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-web-ci.yml'
  pull_request:
    branches: [desktop-web]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-web-ci.yml'

jobs:
  typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run api:prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test
