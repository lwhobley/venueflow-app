name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'vitest.ui.config.ts'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'vitest.ui.config.ts'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run api:prisma:generate
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run test:ui -- --coverage
      - name: Verify Expo web bundle
        run: npx expo export --platform web
