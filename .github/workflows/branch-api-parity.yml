name: Branch API Parity Check

# packages/api is meant to be identical between `main` (deployed to Railway)
# and `desktop-web` (deployed to Cloudflare Pages, but sharing the same
# backend source so EAS/mobile builds taken from that branch stay correct).
# A real production bug (floor module routes + response shapes) shipped
# because a fix landed on desktop-web and was never ported to main — this
# check catches that class of drift the moment it happens instead of weeks
# later. It only reports; it does not gate merges on either branch.

on:
  push:
    branches: [main, desktop-web]
  schedule:
    # Catch-all in case a merge lands without a push event reaching both
    # branches' history in the expected order.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  check-parity:
    name: Diff packages/api between main and desktop-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff packages/api/** between branches
        run: |
          git fetch origin main desktop-web --quiet
          DIFF=$(git diff origin/main origin/desktop-web -- packages/api/ | cat)
          if [ -n "$DIFF" ]; then
            echo "## ⚠️ packages/api has diverged between main and desktop-web" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            echo "$DIFF" | head -c 60000 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "packages/api differs between main and desktop-web:"
            echo "$DIFF"
            echo ""
            echo "If this is a deliberate in-progress change, ignore this run."
            echo "If a real fix landed on one branch and not the other, cherry-pick it now."
            exit 1
          fi
          echo "packages/api is in sync between main and desktop-web." >> "$GITHUB_STEP_SUMMARY"
