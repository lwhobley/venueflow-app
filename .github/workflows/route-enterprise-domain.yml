name: Route enterprise domain to desktop Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Route venuewrangler.org to the enterprise desktop app
        shell: bash
        run: |
          set -euo pipefail

          api='https://api.cloudflare.com/client/v4'
          zone_name='venuewrangler.org'
          pages_project='venueflow-desktop-web'
          pages_target='venueflow-desktop-web.pages.dev'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zone_json="$(curl --fail-with-body --silent --show-error \
            --header "${auth_header}" \
            "${api}/zones?name=${zone_name}")"
          zone_id="$(jq -er '.result | if length == 1 then .[0].id else error("expected exactly one zone") end' <<<"${zone_json}")"

          for domain in 'venuewrangler.org' 'www.venuewrangler.org'; do
            records_json="$(curl --fail-with-body --silent --show-error \
              --header "${auth_header}" \
              "${api}/zones/${zone_id}/dns_records?name.exact=${domain}&per_page=100")"
            record_count="$(jq -er '.result | length' <<<"${records_json}")"
            record_body="$(jq -nc \
              --arg name "${domain}" \
              --arg content "${pages_target}" \
              '{type:"CNAME", name:$name, content:$content, proxied:true, ttl:1}')"

            if [[ "${record_count}" == '0' ]]; then
              result="$(curl --fail-with-body --silent --show-error \
                --request POST \
                --header "${auth_header}" \
                --header 'Content-Type: application/json' \
                --data "${record_body}" \
                "${api}/zones/${zone_id}/dns_records")"
            elif [[ "${record_count}" == '1' ]]; then
              record_id="$(jq -er '.result[0].id' <<<"${records_json}")"
              result="$(curl --fail-with-body --silent --show-error \
                --request PUT \
                --header "${auth_header}" \
                --header 'Content-Type: application/json' \
                --data "${record_body}" \
                "${api}/zones/${zone_id}/dns_records/${record_id}")"
            else
              echo "Refusing to alter ${domain}: found ${record_count} DNS records." >&2
              exit 1
            fi

            jq -e '.success == true' >/dev/null <<<"${result}"

            domain_result="$(curl --fail-with-body --silent --show-error \
              --request PATCH \
              --header "${auth_header}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${pages_project}/domains/${domain}")"
            jq -e '.success == true' >/dev/null <<<"${domain_result}"
            echo "Routed ${domain} to ${pages_target}."
          done
