name: Deploy Cloudflare Pages

on:
  push:
    # Only desktop-web deploys. It is the Cloudflare Pages project's
    # Production Branch, so it is the single source of what venuewrangler.com
    # serves. Do NOT add main here: this job always deploys under the
    # --branch desktop-web label, so a main push would publish main's site/
    # straight to production and silently clobber desktop-web's live content.
    # Site changes made on main must be ported to desktop-web to go live.
    branches:
      - desktop-web
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The site/ directory is a static marketing landing page (no build step).
      # The Cloudflare Pages project's Production Branch is set to
      # "desktop-web" (not "main") — deploying under any other branch name
      # only creates a Preview, so this must match that setting exactly for
      # pushes to actually reach venuewrangler.com. If the Cloudflare project
      # setting is ever changed, update this to match.
      - name: Deploy landing site to Cloudflare Pages
        run: npx wrangler@3.114.17 pages deploy site --project-name venue-wrangler --branch desktop-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
