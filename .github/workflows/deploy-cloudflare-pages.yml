name: Deploy Cloudflare Pages

on:
  push:
    # Desktop web app lives on its own branch (kept separate from the mobile
    # app on main) and deploys itself. Do not merge this into main.
    branches:
      - desktop-web
    paths:
      # Marketing site, the web app (served at /app), and anything its bundle
      # is built from. A change to app code must redeploy the /app build too.
      - 'site/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Export the Expo web app. EXPO_WEB_BASE_URL makes every asset/route URL
      # resolve under /app so it can be served on the same origin as the
      # marketing site. EXPO_PUBLIC_API_URL is also baked into app.json's extra,
      # but is set here too so the bundle points at the same production database.
      - name: Build web app
        run: npx expo export --platform web --output-dir web-dist
        env:
          EXPO_WEB_BASE_URL: /app
          EXPO_PUBLIC_API_URL: https://venue-wranglerapi-production.up.railway.app/api

      # Assemble the deploy root: the static marketing site at /, the web app at
      # /app. site/_redirects (copied into the root) adds the /app SPA fallback.
      - name: Assemble deploy directory
        run: |
          rm -rf deploy
          mkdir -p deploy/app
          cp -r site/. deploy/
          cp -r web-dist/. deploy/app/

      # --branch is only the Cloudflare Pages deployment label: it must match
      # the project's configured production branch (codex/desktop-layout) so
      # deploys hit the live venue-wrangler.pages.dev URL. If you change the
      # production branch to "main" in the Cloudflare dashboard, update this flag.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy deploy --project-name venue-wrangler --branch codex/desktop-layout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
