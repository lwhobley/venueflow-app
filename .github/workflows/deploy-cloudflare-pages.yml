name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
      - desktop-web
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # The site/ directory is a static marketing landing page (no build step).
      # The Cloudflare Pages project's Production Branch is set to
      # "desktop-web" (not "main") — deploying under any other branch name
      # only creates a Preview, so this must match that setting exactly for
      # pushes to actually reach venuewrangler.com. If the Cloudflare project
      # setting is ever changed, update this to match.
      - name: Deploy landing site to Cloudflare Pages
        run: npx wrangler@3 pages deploy site --project-name venue-wrangler --branch desktop-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
