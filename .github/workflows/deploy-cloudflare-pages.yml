name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The site/ directory is a static marketing landing page (no build step).
      # --branch is only the Cloudflare Pages deployment label: it must match
      # the project's configured production branch (codex/desktop-layout) so
      # deploys hit the live venue-wrangler.pages.dev URL. The git branch of
      # the same name no longer exists; if you change the production branch to
      # "main" in the Cloudflare dashboard, update this flag to match.
      - name: Deploy landing site to Cloudflare Pages
        run: npx wrangler pages deploy site --project-name venue-wrangler --branch codex/desktop-layout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
