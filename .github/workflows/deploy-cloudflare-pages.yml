name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_CONVEX_URL: https://dashing-eel-31.convex.cloud
          EXPO_PUBLIC_CONVEX_SITE_URL: https://dashing-eel-31.convex.site
          EXPO_PUBLIC_BILLING_ENABLED: "false"

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name venue-wrangler --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
