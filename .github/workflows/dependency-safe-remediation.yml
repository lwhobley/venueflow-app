name: Safe Dependency Remediation

on:
  push:
    branches: [security/dependency-audit]
    paths:
      - '.github/workflows/dependency-safe-remediation.yml'

permissions:
  contents: write

jobs:
  safe-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply only non-breaking npm audit fixes to lockfile
        shell: bash
        run: |
          # npm exits non-zero while any advisory remains, including advisories
          # with no patched release. Preserve any safe lockfile fixes it can
          # apply, then let the dedicated audit job report what remains.
          npm audit fix --package-lock-only || true
      - name: Commit safe lockfile remediation
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "No non-breaking dependency fixes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Apply safe npm audit fixes"
          git push origin HEAD:security/dependency-audit
