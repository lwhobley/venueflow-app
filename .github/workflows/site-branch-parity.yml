name: Site branch parity

# site/ is served to production from the desktop-web branch, not main
# (see deploy-cloudflare-pages.yml). Both copies live in this repository, so
# they drift silently: a security fix merged to main looks shipped in review
# and never reaches a user. That is exactly what happened — the fix removing
# the API session bearer from localStorage sat on main while production kept
# writing it, alongside a missing HSTS header and a diverged privacy policy.
#
# This job makes that drift loud. It does not decide which branch is right;
# it only refuses to let them differ unnoticed.
on:
  push:
    branches: [main, desktop-web]
    paths:
      - 'site/**'
      - '.github/workflows/site-branch-parity.yml'
  pull_request:
    branches: [main, desktop-web]
    paths:
      - 'site/**'
      - '.github/workflows/site-branch-parity.yml'
  schedule:
    # Catches drift introduced by a push that skipped the paths filter.
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: main and desktop-web serve the same site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare site/ across both branches
        run: |
          set -Eeuo pipefail
          git fetch --quiet origin main desktop-web

          if git diff --quiet origin/main origin/desktop-web -- site/; then
            echo "site/ is identical on main and desktop-web."
            exit 0
          fi

          echo "::error::site/ differs between main and desktop-web. Production serves desktop-web, so anything only on main is NOT live."
          echo
          echo "Diverged files:"
          git diff --name-status origin/main origin/desktop-web -- site/
          echo
          echo "Resolve by porting the reviewed copy to the deployed branch:"
          echo "  git checkout desktop-web && git checkout main -- site/ && git commit && git push"
          echo
          echo "Note that site/ pages are interdependent — port the directory as a unit, not individual files."
          exit 1
