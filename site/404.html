<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Page Not Found | Venue Wrangler</title>
  <style>
    :root { --ink:#1f2a24; --muted:#657168; --green:#356b4a; --line:#d8e1d9; --soft:#f4f8f4; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:var(--soft); font-family:Arial, sans-serif; }
    main { width:min(100%, 520px); background:#fff; border:1px solid var(--line); border-radius:20px; padding:32px; box-shadow:0 18px 50px rgba(31,42,36,.08); text-align:center; }
    h1 { margin:0 0 12px; font-size:32px; color:var(--ink); }
    p { color:var(--muted); line-height:1.5; margin:0 0 24px; font-size:16px; }
    a.btn { display:inline-block; border-radius:10px; padding:13px 24px; background:var(--green); color:#fff; text-decoration:none; font-weight:700; }
    a.btn:hover { opacity:0.9; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/" class="btn">Return to home</a>
  </main>
</body>
</html>
